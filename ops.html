<!doctype html>
<html lang="ko">
<head>
<title>마케팅 비서 운영</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="core/style.css">
<style>
  /* 단계 막대 */
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-block: 18px 6px; }
  .step { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .step b { font-size: 22px; font-weight: 700; }
  .step span { font-size: 12px; color: var(--muted); }
  .step.on { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .step.hot b { color: var(--warn); }

  .main { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; padding-block: 12px 40px; align-items: start; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .list-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 2px 2px 0; }
  .item { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .item:hover { border-color: var(--muted); }
  .item.on { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .item .r1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .item .name { font-weight: 700; font-size: 15px; }
  .item .st { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .item .sub { font-size: 12px; color: var(--muted); }
  .item .mix { display: flex; gap: 4px; flex-wrap: wrap; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }

  /* 상세 */
  .detail { padding: 22px 24px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .d-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .d-head h2 { font-size: 22px; }
  .d-head .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .track { display: flex; gap: 0; align-items: center; }
  .track .t { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .track .t i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: inline-grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; }
  .track .t.done i { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .track .t.now { color: var(--ink); font-weight: 700; }
  .track .t.now i { border-color: var(--primary); }
  .track .bar { width: 22px; height: 2px; background: var(--line); margin: 0 6px; }

  .next { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; border-radius: var(--r); background: var(--sunk); flex-wrap: wrap; }
  .next p { margin: 0; font-weight: 600; }
  .next .acts { display: flex; gap: 8px; flex-wrap: wrap; }

  .sec h3 { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
  .mods { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .mod { border-radius: var(--r); padding: 12px 14px; background: var(--m-soft); }
  .mod b { color: var(--m); display: block; margin-bottom: 2px; }
  .mod.off { background: var(--sunk); }
  .mod-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; }
  .mod-h b { margin: 0; }
  .cfg { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .opts { display: flex; gap: 4px; flex-wrap: wrap; }
  .opt { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--ink); }
  .opt.on { border-color: var(--m); color: var(--m); font-weight: 700; }
  .kv { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .memo { padding: 10px 14px; border-left: 3px solid var(--line); color: var(--muted); }
  .soldraft { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; }
  .soldraft .slogan { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .soldraft ol { margin: 8px 0 0; padding-left: 18px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  .soltab { width: 100%; border-collapse: collapse; font-size: 13px; }
  .soltab td { padding: 7px 0; border-top: 1px solid var(--line); }
  .soltab tr:first-child td { border-top: 0; }
  .soltab .r { text-align: right; padding-left: 10px; white-space: nowrap; }
  @media (max-width: 760px) { .soldraft { grid-template-columns: 1fr; } }
  .files { display: flex; flex-direction: column; gap: 6px; }
  .file { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 13px; }
  .file:hover { border-color: var(--ink); }
  .file .k { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--sunk); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .file .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .o { font-weight: 700; white-space: nowrap; }

  /* 제안서 */
  .phase { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .phase:first-child { border-top: 0; }
  .phase > b { font-size: 13px; padding-top: 2px; }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row .d { width: 44px; color: var(--muted); font-size: 13px; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); }
  td.r, th.r { text-align: right; white-space: nowrap; }
  tfoot td { font-weight: 700; border-bottom: 0; font-size: 15px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* 과업 보드 */
  .prog { display: flex; align-items: center; gap: 12px; }
  .prog .b { flex: 1; height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
  .prog .b i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .lane { border-radius: var(--r); background: var(--sunk); padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lane-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .open { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-bottom: 6px; }
  .open a { font-size: 12px; color: var(--m); text-decoration: none; font-weight: 600; }
  .open a.main { width: 100%; text-align: center; background: var(--surface); border: 1px solid var(--m); border-radius: 8px; padding: 8px; font-size: 13px; }
  .open a:hover { text-decoration: underline; }
  .task { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .task .d { font-size: 12px; color: var(--muted); }
  .task .d.late { color: var(--warn); font-weight: 700; }
  .task .ti { font-size: 13px; }
  .task.done .ti { color: var(--muted); text-decoration: line-through; }
  .pill { border: 0; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: var(--sunk); color: var(--muted); white-space: nowrap; }
  .pill.doing { background: var(--m-soft); color: var(--m); }
  .pill.review { background: var(--common); color: #fff; }
  .pill.done { background: transparent; color: var(--ok); }

  .log { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .log span { display: inline-block; width: 82px; }

  .login { max-width: 360px; margin: 60px auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .login input { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

  @media (max-width: 860px) {
    .main { grid-template-columns: 1fr; }
    .steps { grid-template-columns: repeat(2, 1fr); }
    .detail { padding: 18px 16px; }
    .track .t:not(.now) em { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><i></i>마케팅 비서 · 운영</div>
    <span class="chip" id="mode"></span>
    <div class="sp"></div>
    <a class="btn" href="index.html">고객 사이트</a>
    <button class="btn ghost" id="resetBtn" type="button">데모 초기화</button>
  </div>
</header>
<div id="app"></div>

<script>
// 운영사 링크는 바로 실행 화면(작업 대시보드)으로 연다. 신청·과업 현황은 ops.html#board
if (location.hash !== '#board') location.replace('dash/index.html#press');
</script>
<script src="core/config.js"></script>
<script src="core/util.js"></script>
<script src="modules/press.js"></script>
<script src="modules/content.js"></script>
<script src="modules/influencer.js"></script>
<script src="core/plan.js"></script>
<script src="core/sample.js"></script>
<script src="core/api.js"></script>
<script>
const S = { apps: [], filter: 'todo', sel: null, cur: null, tasks: [] };
const $app = document.getElementById('app');
const STEP_FILTERS = [
  ['new', '신청 접수', '제안서를 만들어 주세요'],
  ['proposal', '제안서 작성', '확인 후 고객에게 보내기'],
  ['sent', '컨펌 대기', '고객 답을 기다리는 중'],
  ['active', '과업 진행', '언론·콘텐츠·인플루언서'],
];

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast fade'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

async function refresh(keepSel) {
  S.apps = await API.list();
  if (!keepSel || !S.apps.some(a => a.id === S.sel)) {
    const first = visibleApps()[0];
    S.sel = first ? first.id : null;
  }
  await loadCur();
  render();
}

async function loadCur() {
  if (!S.sel) { S.cur = null; S.tasks = []; return; }
  const d = await API.get(S.sel);
  S.cur = d.app; S.tasks = d.tasks || [];
}

function visibleApps() {
  if (S.filter === 'todo') return S.apps.filter(a => a.status !== 'done');
  return S.apps.filter(a => a.status === S.filter);
}

function mixTags(app) {
  return selectedModules(app).map(m => `<span class="tag m-${m.id}"><span class="dot"></span>${m.name}</span>`).join('');
}

/* ---------- 화면 ---------- */
function render() {
  document.getElementById('mode').textContent = API.isDemo() ? '데모 · 이 브라우저에만 저장' : '서버 연결됨';
  document.getElementById('resetBtn').hidden = !API.isDemo();
  if (API.needLogin()) return renderLogin();

  const count = k => S.apps.filter(a => a.status === k).length;
  const list = visibleApps();
  const filterName = S.filter === 'todo' ? '진행 중 전체' : STATUS[S.filter];
  $app.innerHTML = `
    <div class="wrap steps">
      ${STEP_FILTERS.map(([k, name, hint]) => `
        <button type="button" class="step ${S.filter === k ? 'on' : ''} ${k === 'new' && count(k) ? 'hot' : ''}" data-filter="${k}">
          <b class="num">${count(k)}</b><strong>${name}</strong><span>${hint}</span>
        </button>`).join('')}
    </div>
    <div class="wrap main">
      <div class="list">
        <div class="list-head"><span>${filterName} ${list.length}건</span>
          ${S.filter !== 'todo' ? '<button class="btn ghost" type="button" data-filter="todo">전체 보기</button>' : ''}</div>
        ${list.length ? list.map(a => `
          <button type="button" class="item ${a.id === S.sel ? 'on' : ''}" data-sel="${a.id}">
            <div class="r1"><span class="name">${U.esc(a.company.name)}</span><span class="st">${STATUS[a.status]}</span></div>
            <div class="sub">${U.esc(a.expo.name)} · ${U.md(a.expo.start)}~${U.md(a.expo.end)}</div>
            <div class="mix">${mixTags(a)}</div>
          </button>`).join('') : '<div class="empty">해당 단계의 신청이 없습니다.</div>'}
      </div>
      <section class="card detail fade" id="detail">${S.cur ? renderDetail(S.cur) : '<div class="empty">왼쪽에서 신청을 고르세요.</div>'}</section>
    </div>`;
}

function renderLogin() {
  $app.innerHTML = `
    <form class="card login" id="loginForm">
      <h2>운영사 로그인</h2>
      <label for="pw" class="muted">공용 비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn primary lg" type="submit">들어가기</button>
      <p class="muted" id="loginErr"></p>
    </form>`;
}

function renderDetail(a) {
  const idx = STATUS_ORDER.indexOf(a.status);
  const track = ['신청', '제안서', '컨펌', '진행'].map((n, i) =>
    `${i ? '<span class="bar"></span>' : ''}<span class="t ${i < idx || a.status === 'done' ? 'done' : ''} ${i === idx ? 'now' : ''}"><i>${i < idx || a.status === 'done' ? '✓' : i + 1}</i><em>${n}</em></span>`).join('');

  return `
    <div class="d-head">
      <div>
        <h2>${U.esc(a.company.name)}</h2>
        <div class="meta">${U.esc(a.expo.name)} · ${U.md(a.expo.start)}~${U.md(a.expo.end)} · 부스 ${U.esc(a.expo.booth || '-')}</div>
        <div class="meta">${U.esc(a.company.person)} · ${U.esc(a.company.email)} · ${U.esc(a.company.phone)}</div>
      </div>
      <div class="track">${track}</div>
    </div>
    ${renderNext(a)}
    ${a.status === 'active' || a.status === 'done' ? renderBoard(a) : ''}
    ${a.proposal && a.status !== 'new' ? renderProposal(a) : renderRequest(a)}
    <div class="sec"><h3>진행 기록</h3><div class="log">${(a.log || []).map(l => `<div><span class="num">${U.stamp(l.at)}</span>${U.esc(l.text)}</div>`).join('')}</div></div>`;
}

function renderNext(a) {
  const box = (msg, acts) => `<div class="next"><p>${msg}</p><div class="acts">${acts}</div></div>`;
  if (a.status === 'new') return box('상담 후 아래에서 구성을 조정하고 제안서를 만드세요.', `<button class="btn primary lg" data-act="make" ${selectedModules(a).length ? '' : 'disabled'}>제안서 만들기</button>`);
  if (a.status === 'proposal') return box('제안서를 확인하고 고객에게 보내세요.', '<button class="btn" data-act="copy">메일용 텍스트 복사</button><button class="btn" data-act="reconfig">구성 고치기</button><button class="btn primary lg" data-act="send">보냄으로 표시</button>');
  if (a.status === 'sent') return box(`${U.stamp(a.proposal.sentAt)}에 보냈습니다. 고객 답을 받으면 기록하세요.`, '<button class="btn" data-act="revise">수정 요청 받음</button><button class="btn primary lg" data-act="confirm">컨펌 받음 · 과업 시작</button>');
  if (a.status === 'active') {
    const left = S.tasks.filter(t => t.status !== 'done').length;
    return box(left ? `남은 과업 ${left}개. 상태 버튼을 눌러 단계를 바꿉니다.` : '모든 과업이 끝났습니다.', `<button class="btn ${left ? '' : 'primary lg'}" data-act="finish" ${left ? 'disabled' : ''}>완료 처리</button>`);
  }
  return box('완료된 건입니다.', '');
}

function renderRequest(a) {
  const c = a.company, edit = a.status === 'new';
  const info = [['상담 종류', CONSULT[a.consult]], ['업종', c.industry], ['예산', a.budget], ['고른 상황', a.situation], ['홈페이지', c.site]].filter(x => x[1]);
  const mods = edit ? MODULES.map(m => {
    const opt = a.mix[m.id];
    return `<div class="mod m-${m.id} ${opt ? '' : 'off'}">
      <label class="mod-h"><input type="checkbox" data-modon="${m.id}" ${opt ? 'checked' : ''}><b>${m.name}</b></label>
      ${opt ? m.fields.map(f => `<div class="cfg"><span>${f.label}</span><div class="opts">${f.options.map(([v, n]) => {
        const on = f.type === 'multi' ? opt[f.key].includes(v) : opt[f.key] === v;
        return `<button type="button" class="opt ${on ? 'on' : ''}" data-cfg="${m.id}|${f.key}|${v}">${n}</button>`;
      }).join('')}</div></div>`).join('') : '<span class="muted">고객이 고르지 않음</span>'}
    </div>`;
  }).join('') : selectedModules(a).map(m => `<div class="mod m-${m.id}"><b>${m.name}</b>${U.esc(m.describe(a.mix[m.id]))}</div>`).join('');
  return `
    ${info.length ? `<div class="sec"><h3>신청 정보</h3><div class="kv">${info.map(([k, v]) => `<span>${k}</span><span>${U.esc(v)}</span>`).join('')}</div></div>` : ''}
    <div class="sec"><h3>${edit ? '구성 조정 · 상담 내용대로 고르세요' : '확정 구성'}</h3><div class="mods">${mods}</div></div>
    ${a.memo ? `<div class="sec"><h3>문의 내용</h3><div class="memo">${U.esc(a.memo)}</div></div>` : ''}
    ${renderSolutionDraft(a.solution)}
    ${(a.files || []).length ? `<div class="sec"><h3>첨부 자료 <small class="muted">${a.files.length}개</small></h3><div class="files">${a.files.map((f, i) => `
      <button type="button" class="file" data-file="${i}"><span class="k">${FILE_KIND[f.kind] || '자료'}</span><span class="n">${U.esc(f.name)}</span><span class="muted">${fileSize(f.size)}</span><span class="o">열기</span></button>`).join('')}</div></div>` : ''}`;
}
// 고객이 신청 화면에서 본 AI 솔루션 초안 (상담 출발점)
function renderSolutionDraft(s) {
  if (!s) return '';
  const m = s.message || {}, pct = v => Math.round(v * 100) + '%';
  const state = s.none ? `배정 예산 없음 · 권장 ${U.won(s.total)}` : s.over ? `예산 ${U.won(s.budget)}보다 ${U.won(s.over)} 초과` : `예산 ${U.won(s.budget)} 중 ${U.won(s.total)}${s.left ? ` · ${U.won(s.left)} 남음` : ''}`;
  return `<div class="sec"><h3>고객이 본 AI 솔루션 초안 <small class="muted">${s.engine === 'template' ? '예시 초안 · AI 연결 전' : 'AI 생성'} · ${U.stamp(s.createdAt)}</small></h3>
    <div class="soldraft">
      <div><div class="slogan">“${U.esc(m.slogan)}”</div><div class="muted" style="font-size:13px">누구에게 · ${U.esc(m.target)}</div>
        <ol>${(m.points || []).map(p => `<li>${U.esc(p)}</li>`).join('')}</ol></div>
      <table class="soltab">${s.rows.map(r => `<tr class="m-${r.module}"><td><span class="tag"><span class="dot"></span>${U.esc(r.name)}</span> <span class="muted">${U.esc(r.summary)}</span></td><td class="r num">${U.won(r.cost)}</td><td class="r num muted">${pct(r.share)}</td></tr>`).join('')}
        <tr class="m-common"><td><span class="tag"><span class="dot"></span>홍보 플래닝</span></td><td class="r num">${U.won(s.fee)}</td><td class="r num muted">${pct(s.fee / s.total)}</td></tr>
        <tr><td><b>합계</b> <span class="muted">${state}</span></td><td class="r num"><b>${U.won(s.total)}</b></td><td></td></tr></table>
    </div>
    <p class="muted" style="font-size:12px; margin:8px 0 0">위 구성이 '구성 조정'에 미리 들어가 있습니다. 상담 내용대로 고치세요.</p></div>`;
}
const FILE_KIND = { company: '회사 소개서', expo: '행사 정보' };
function fileSize(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }

function renderProposal(a) {
  const p = a.proposal;
  const phases = PHASES.map(([k, n]) => {
    const rows = p.schedule.filter(s => phaseOf(s.date, a.expo) === k);
    if (!rows.length) return '';
    return `<div class="phase"><b>${n}</b><div class="rows">${rows.map(s =>
      `<div class="row m-${s.module}"><span class="d num">${U.md(s.date)}</span><span class="dot"></span><span>${U.esc(s.title)}</span></div>`).join('')}</div></div>`;
  }).join('');
  const quote = p.quote.map(q => `
    <tr class="m-${q.module}"><td><span class="dot"></span> ${U.esc(q.item)}</td><td class="r num">${q.qty}${q.unit}</td><td class="r num">${U.won(q.price)}</td><td class="r num">${U.won(q.qty * q.price)}</td></tr>`).join('');
  const open = a.status === 'proposal' || a.status === 'sent';
  return `
    ${renderRequest(a)}
    <details class="sec" ${open ? 'open' : ''}>
      <summary style="cursor:pointer"><h3 style="display:inline">제안서 · ${U.stamp(p.createdAt)} 작성</h3></summary>
      <div style="margin-top:12px; display:flex; flex-direction:column; gap:18px">
        <div>${phases}</div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>항목</th><th class="r">수량</th><th class="r">단가</th><th class="r">금액</th></tr></thead>
          <tbody>${quote}</tbody>
          <tfoot><tr><td colspan="3">합계</td><td class="r num">${U.won(p.total)}</td></tr></tfoot>
        </table></div>
        <div class="note">${APP_CONFIG.VAT_NOTE}</div>
      </div>
    </details>`;
}

// 과업 진행 중 각 파트의 작업 화면 = 기존 전시 대시보드(dash/, 셀브릿지 데모)의 해당 메뉴
const WORK_VIEWS = {
  press: [['press', '보도자료 작성'], ['dist', '배포·매체'], ['pr', '보도 성과']],
  content: [['cblog', '블로그'], ['ccard', '카드뉴스'], ['cvideo', '영상'], ['cperf', '전체 성과']],
  influencer: [['inf', '인플루언서 섭외'], ['trial', '체험단'], ['iperf', '성과']],
};

function renderBoard(a) {
  const done = S.tasks.filter(t => t.status === 'done').length, all = S.tasks.length || 1;
  const today = U.today();
  const lanes = selectedModules(a).map(m => {
    const ts = S.tasks.filter(t => t.module === m.id);
    const d = ts.filter(t => t.status === 'done').length;
    return `<div class="lane m-${m.id}">
      <div class="lane-h"><span class="tag"><span class="dot"></span>${m.name}</span><span class="muted num">${d}/${ts.length}</span></div>
      <div class="open">${(WORK_VIEWS[m.id] || []).map(([v, n], i) => `<a class="${i ? 'sub' : 'main'}" href="dash/index.html#${v}">${n}${i ? '' : ' 화면 열기 →'}</a>`).join('')}</div>
      ${ts.map(t => {
        const st = TASK_STATUS.find(x => x[0] === t.status);
        const late = t.status !== 'done' && t.due < today;
        return `<div class="task ${t.status}"><span class="d num ${late ? 'late' : ''}">${U.md(t.due)}</span><span class="ti">${U.esc(t.title)}</span><button class="pill ${t.status}" data-task="${t.id}" title="눌러서 다음 단계로">${st[1]}</button></div>`;
      }).join('')}
    </div>`;
  }).join('');
  return `<div class="sec"><h3>과업 · 각 파트 화면은 데모 고객 셀브릿지(가상) 데이터로 열립니다</h3>
    <div class="prog" style="margin-bottom:12px"><div class="b"><i style="width:${Math.round(done / all * 100)}%"></i></div><span class="num">${done}/${S.tasks.length}</span></div>
    <div class="board">${lanes}</div></div>`;
}

/* ---------- 동작 ---------- */
function addLog(a, text) {
  a.log = a.log || [];
  a.log.push({ at: new Date().toISOString(), text });
}

const ACT = {
  async make(a) {
    a.proposal = buildProposal(a);
    a.status = 'proposal';
    addLog(a, '제안서 작성');
    await API.save(a);
    toast('제안서를 만들었습니다');
  },
  async reconfig(a) {
    a.status = 'new';
    addLog(a, '구성 다시 조정');
    await API.save(a);
  },
  async send(a) {
    a.proposal.sentAt = new Date().toISOString();
    a.status = 'sent';
    addLog(a, '고객에게 제안서 보냄');
    await API.save(a);
    toast('컨펌 대기로 옮겼습니다');
  },
  async revise(a) {
    a.status = 'proposal';
    addLog(a, '고객 수정 요청');
    await API.save(a);
    toast('제안서 작성으로 되돌렸습니다');
  },
  async confirm(a) {
    a.confirmedAt = new Date().toISOString();
    a.status = 'active';
    addLog(a, '고객 컨펌 · 과업 시작');
    const tasks = buildTasks(a);
    await API.saveTasks(tasks);
    await API.save(a);
    toast(`과업 ${tasks.length}개를 만들었습니다`);
  },
  async finish(a) {
    a.status = 'done';
    addLog(a, '완료');
    await API.save(a);
    toast('완료 처리했습니다');
  },
  async copy(a) {
    const text = proposalText(a);
    try { await navigator.clipboard.writeText(text); toast('복사했습니다'); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'width:100%;height:220px;margin-top:8px';
      document.querySelector('.next').after(ta); ta.select();
      toast('선택된 글을 복사해 주세요');
    }
    return 'stay';
  },
};

document.addEventListener('click', async e => {
  const f = e.target.closest('[data-filter]');
  if (f) { S.filter = f.dataset.filter; await refresh(false); return; }
  const s = e.target.closest('[data-sel]');
  if (s) { S.sel = s.dataset.sel; await loadCur(); render(); return; }
  const fb = e.target.closest('[data-file]');
  if (fb && S.cur) {
    const f = S.cur.files[+fb.dataset.file];
    const w = f.url ? null : window.open('', '_blank');
    try {
      const url = await API.fileUrl(f);
      if (f.url) window.open(url, '_blank', 'noopener');
      else if (/^(application\/pdf|image\/)/.test(f.type) && w) w.location.href = url;
      else { if (w) w.close(); const l = document.createElement('a'); l.href = url; l.download = f.name; l.click(); }
    } catch (err) { if (w) w.close(); toast(err.message); }
    return;
  }
  const act = e.target.closest('[data-act]');
  if (act && S.cur) {
    act.disabled = true;
    try {
      const r = await ACT[act.dataset.act](S.cur);
      if (r !== 'stay') { S.filter = S.cur.status === 'done' ? 'todo' : S.cur.status; await refresh(true); }
      else act.disabled = false;
    } catch (err) { toast(err.message); act.disabled = false; }
    return;
  }
  const mo = e.target.closest('[data-modon]');
  if (mo && S.cur) {
    const m = moduleById(mo.dataset.modon);
    if (S.cur.mix[m.id]) delete S.cur.mix[m.id]; else S.cur.mix[m.id] = defaultOpt(m);
    await API.save(S.cur); render(); return;
  }
  const cf = e.target.closest('[data-cfg]');
  if (cf && S.cur) {
    const [mid, key, v] = cf.dataset.cfg.split('|'), f = U.field(moduleById(mid), key), o = S.cur.mix[mid];
    if (f.type === 'multi') {
      const next = o[key].includes(v) ? o[key].filter(x => x !== v) : o[key].concat(v);
      if (!next.length) { toast('하나 이상 골라야 합니다'); return; }
      o[key] = next;
    } else o[key] = v;
    await API.save(S.cur); render(); return;
  }
  const tb = e.target.closest('[data-task]');
  if (tb) {
    const t = S.tasks.find(x => x.id === tb.dataset.task);
    const i = TASK_STATUS.findIndex(x => x[0] === t.status);
    t.status = TASK_STATUS[(i + 1) % TASK_STATUS.length][0];
    await API.saveTasks([t]);
    render();
  }
});

document.addEventListener('submit', async e => {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  try { await API.login(document.getElementById('pw').value); await refresh(false); }
  catch (err) { document.getElementById('loginErr').textContent = err.message; }
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  API.reset(); S.filter = 'todo'; await refresh(false); toast('예시 데이터로 되돌렸습니다');
});

API.needLogin() ? render() : refresh(false);
</script>
