<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전시 마케팅 비서 작업 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#f2f4f8; --panel:#ffffff; --ink:#152033; --sub:#5b687c; --line:#dfe4ec; --sand:#edf1f7;
  --side:#ffffff; --side-ink:#33415a; --brand:#1f4fd1; --brand-weak:#e7edfc; --accent:#0d9488;
  --core:#0d9488; --core-weak:#dcf3f0; --warn:#c2410c; --warn-weak:#fde7db;
  --ok:#15803d; --ok-weak:#e1f3e7; --wait:#8a6312; --wait-weak:#fbefd2; --muted:#94a0b2;
  --c1:#1f4fd1; --c2:#0d9488; --c3:#f59e0b; --c4:#8b5cf6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:216px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:20px 0}
.side.admin{background:#1d2b3a}
.logo{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo b{display:block;color:#fff;font-size:16px}
.logo span{font-size:12px;opacity:.7}
.client{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1);font-size:12px}
.client b{display:block;color:#fff;font-size:14px;margin-top:2px}
.nav{list-style:none;margin:12px 0;padding:0;flex:1}
.nav .grp{padding:12px 20px 4px;font-size:11px;opacity:.55}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 20px;color:var(--side-ink);text-decoration:none}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--brand);color:#fff;font-weight:600}
.side.admin .nav a.on{background:#2f5d8a}
.nav .cnt{background:#f5b83d;color:#3b2a00;border-radius:10px;font-size:11px;font-weight:700;padding:0 7px}
.side-foot{padding:12px 20px;font-size:12px;opacity:.75}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.25);color:var(--side-ink);border-radius:6px;padding:4px 10px;margin-top:8px;width:100%}
.main{flex:1;min-width:0;padding:24px 28px 48px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:22px;margin:0}
.top .meta{color:var(--sub);font-size:13px;margin-top:4px}
.demo{display:inline-block;background:var(--wait-weak);color:var(--wait);border-radius:4px;font-size:11px;font-weight:700;padding:1px 6px;margin-left:6px;vertical-align:middle}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;color:var(--sub)}
.seg button.on{background:var(--brand);color:#fff}
select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.grid{display:grid;gap:14px}
.grid>*,.ca>*,.preview>*{min-width:0}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto}
.card h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font-weight:400;color:var(--sub);font-size:12px}
.kpi .l{color:var(--sub);font-size:13px}
.kpi .v{font-size:26px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--sub)}
.kpi.core{background:var(--core-weak);border-color:#7fd3c9}
.kpi.core .v{color:var(--core)}
.tag{display:inline-block;border-radius:4px;font-size:11px;font-weight:700;padding:1px 6px}
.tag.core{background:var(--core);color:#fff}
.tag.ai{background:var(--brand);color:#fff}
.bar{height:6px;background:#eef1f6;border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand)}
.kpi.core .bar i{background:var(--core)}
.row2{grid-template-columns:2fr 1fr;margin-top:14px}
.row3{grid-template-columns:1fr 1fr;margin-top:14px}
.row13{grid-template-columns:1fr 2fr;margin-top:14px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;font-size:12px;color:var(--sub)}
.tabs button.on{border-color:var(--brand);color:var(--brand);font-weight:700;background:var(--brand-weak)}
.bigtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.bigtabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 16px;color:var(--sub);font-weight:600}
.bigtabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
svg{display:block;width:100%;height:auto}
svg text{font-family:inherit}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--sub);font-weight:600;text-align:left;border-bottom:1px solid var(--line);padding:8px 6px;white-space:nowrap}
td{border-bottom:1px solid #eef1f6;padding:8px 6px;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.st{display:inline-block;border-radius:10px;font-size:12px;font-weight:600;padding:1px 9px;white-space:nowrap}
.st.ok{background:var(--ok-weak);color:var(--ok)}
.st.wait{background:var(--wait-weak);color:var(--wait)}
.st.warn{background:var(--warn-weak);color:var(--warn)}
.st.mute{background:#eef1f6;color:var(--sub)}
.st.blue{background:#e5eefa;color:#2d5ea3}
.st.dark{background:#1d2b3a;color:#fff}
.funnel .step{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.funnel .step .lb{width:58px;color:var(--sub);font-size:13px}
.funnel .step .fb{flex:1;background:#eef1f6;border-radius:6px;height:34px;position:relative}
.funnel .step .fb i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--brand)}
.funnel .step .fb span{position:absolute;right:10px;top:7px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.funnel .step:first-of-type .fb span{color:#fff}
.funnel .conv{font-size:12px;color:var(--sub);margin:-4px 0 10px 68px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.warn{color:var(--warn);border-color:#f0c4ad}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
/* stepper */
.stepper{display:flex;align-items:flex-start}
.stepper .s{flex:1;text-align:center;position:relative;font-size:12px;color:var(--sub)}
.stepper .s:before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.stepper .s:first-child:before{display:none}
.stepper .s.done:before,.stepper .s.now:before{background:var(--brand)}
.stepper .s i{position:relative;z-index:1;display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;background:#eef1f6;color:var(--sub);font-style:normal;font-weight:700;margin-bottom:4px}
.stepper .s.done i{background:var(--brand);color:#fff}
.stepper .s.now i{background:var(--ink);color:#fff}
.stepper .s.now{color:var(--ink);font-weight:700}
/* thumbs */
.thumb{width:48px;height:48px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;text-align:center;line-height:1.2;padding:3px}
.qrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eef1f6}
.qrow:last-child{border-bottom:0}
.qrow .t{flex:1;min-width:0}
.qrow .t b{display:block;font-size:13px}
.qrow .t span{font-size:12px;color:var(--sub)}
/* content approval */
.ca{display:grid;grid-template-columns:320px 1fr;gap:14px}
.clist .it{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.clist .it.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-weak)}
.clist .it .t{font-weight:600}
.clist .it .s{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-top:4px;gap:6px}
.preview{display:grid;grid-template-columns:300px 1fr;gap:16px}
.phone{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.phone .hd{padding:8px 10px;font-size:12px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.slide{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:700;font-size:19px;padding:22px;line-height:1.35;white-space:pre-line}
.slide small{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:10px;white-space:pre-line}
.slide.v{aspect-ratio:9/12}
.dots{display:flex;justify-content:center;gap:4px;padding:6px}
.dots button{width:7px;height:7px;border-radius:50%;border:0;background:#cfd8d4;padding:0}
.dots button.on{background:var(--brand)}
.phone .cap{padding:10px;font-size:12px;white-space:pre-wrap}
.checks{list-style:none;padding:0;margin:0 0 14px}
.checks li{display:flex;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px solid #f0f3f2}
.checks li b{width:18px;flex:none;text-align:center}
.checks li .r{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.checks li.ok b,.checks li.ok .r{color:var(--ok)}
.checks li.no b,.checks li.no .r{color:var(--warn)}
.checks li.cf b,.checks li.cf .r{color:var(--core)}
.hist{font-size:12px;color:var(--sub);border-left:2px solid var(--line);padding-left:10px;margin:0 0 12px}
.hist div{margin-bottom:6px}
.hist b{color:var(--ink)}
.askbox{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px 10px;font-size:13px;margin:4px 0 12px}
.revchg{margin:4px 0 12px}
.revchg .rc{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;background:#fff}
.revchg .rc .w{font-size:11px;color:var(--sub);margin-bottom:4px}
.revchg del{display:block;color:#b42318;background:#fef3f2;padding:3px 6px;border-radius:6px;white-space:pre-wrap}
.revchg ins{display:block;color:#067647;background:#ecfdf3;text-decoration:none;padding:3px 6px;border-radius:6px;margin-top:4px;white-space:pre-wrap}
mark.ins{background:#d1fadf;color:inherit;border-radius:3px}
.aitag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#7357e0;border-radius:999px;padding:2px 9px;margin-bottom:8px}
textarea,.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
textarea{min-height:70px;resize:vertical}
.doc{border:1px solid var(--line);border-radius:10px;padding:18px;background:#fff;white-space:pre-wrap;font-size:14px;line-height:1.8}
.doc h4{margin:0 0 4px;font-size:18px;white-space:normal}
.doc .dm{font-size:12px;color:var(--sub);margin-bottom:12px;white-space:normal}
.doc .heroimg{height:120px;border-radius:8px;margin-bottom:12px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px}
mark{background:#ffe9a8;padding:0 2px;border-radius:2px}
mark.bad{background:#ffd3c2;color:#8a2a00}
.cuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cut{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.cut .pic{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;position:relative;padding:8px;text-align:center}
.cut .pic span{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.45);border-radius:4px;padding:0 5px;font-size:10px}
.cut .pic em{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.45);border-radius:4px;padding:0 5px;font-size:10px;font-style:normal}
.cut .tx{padding:8px;font-size:12px}
.cut .tx b{color:var(--sub);font-weight:600;margin-right:4px}
.cut .tx>div+div{margin-top:3px}
.vsrc{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:4px}.vsrc.ok{background:#e3f6ee;color:#0d8a5f}.vsrc.cf{background:#fff1e0;color:#c2620c}
video.art{width:100%;height:100%;object-fit:cover;display:block}.upl .ph video{width:100%;height:100%;object-fit:cover;display:block}
.vmode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vmc{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;font:inherit;color:var(--ink)}
.vmc.on{border-color:var(--pri,#2f6bdc);box-shadow:0 0 0 3px rgba(47,107,220,.12)}
.vmc b{font-size:15px}.vmc .d{font-size:13px;color:var(--sub)}.vmc ul{margin:2px 0 0;padding-left:16px;font-size:12px;color:var(--sub)}.vmc li b{font-size:12px;color:var(--ink)}
@media (max-width:700px){.vmode{grid-template-columns:1fr}}
/* forms */
.form{display:grid;grid-template-columns:140px 1fr;gap:10px 14px;align-items:start}
.form label{font-size:13px;color:var(--sub);padding-top:8px}
.form .h{font-size:12px;color:var(--muted);margin-top:2px}
.upl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.upl .ph{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#eef0f4}
.upl .ph img{width:100%;height:100%;object-fit:cover;display:block}
.upl .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px;padding:0;cursor:pointer}
.fchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 11px;font-size:12px;background:#fff}
.fchip a{color:inherit}
.fchip .x{border:0;background:none;color:var(--sub);cursor:pointer;font-size:13px;padding:0 4px}
.fchip .ok{color:#067647;font-weight:700}
.brief{white-space:pre-wrap;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:8px 10px;font-size:13px;margin:4px 0 12px}
textarea.inp{width:100%;min-height:96px;resize:vertical}
.opt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt .o{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;text-align:left;display:block;width:100%}
.opt .o.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-weak);background:#f7fbf9}
.opt .o .k{font-size:12px;color:var(--sub);display:flex;justify-content:space-between}
.opt .o .h{font-size:16px;font-weight:700;margin:6px 0}
.opt .o .d{font-size:13px;color:var(--sub)}
.opt .o .w{font-size:12px;color:var(--brand);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font-size:13px;color:var(--sub)}
.chip.on{background:var(--brand-weak);border-color:var(--brand);color:var(--brand);font-weight:700}
.mix{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0}
.mix div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.toast{position:fixed;right:20px;bottom:20px;background:#0b1426;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.score{font-weight:700;color:var(--brand)}
.why{font-size:12px;color:var(--sub)}
.selbox{position:sticky;top:12px}
.selbox .p{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.tl{position:relative;margin-left:8px;border-left:2px solid var(--line);padding-left:20px}
.tl .ev{position:relative;margin-bottom:14px}
.tl .ev:before{content:"";position:absolute;left:-27px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--muted)}
.tl .ev.done:before{background:var(--brand);border-color:var(--brand)}
.tl .ev.now:before{background:var(--core);border-color:var(--core);box-shadow:0 0 0 4px var(--core-weak)}
.tl .ev .dd{font-size:12px;color:var(--sub)}
.tl .ev .tt{font-weight:600}
.rep{max-width:880px}
.rep h2{font-size:16px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin:26px 0 12px}
.rep .sum{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rep .sum div{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
.rep .sum b{display:block;font-size:20px}
.rep .sum span{font-size:12px;color:var(--sub)}
.rep ul{margin:6px 0;padding-left:20px}
.rep li{margin-bottom:4px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#0b1f4d,#1f4fd1)}
.login .box{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:400px}
.login h1{margin:0 0 4px;font-size:20px}
.login p{margin:0 0 16px;color:var(--sub);font-size:13px}
.login label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.login .btn.pri{width:100%;margin-top:18px;padding:10px}
.login .seg{width:100%}
.login .seg button{flex:1}
.empty{color:var(--sub);text-align:center;padding:30px}
/* 첫 화면: 서비스 소개 → 대시보드로 디졸브 */
.intro{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;background:#1c2a25;color:#fff;overflow:hidden;opacity:1;transition:opacity .9s ease}
.intro.out{opacity:0;pointer-events:none}
.intro img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.03);transition:transform 6s ease-out}
.intro.go img{transform:scale(1.12)}
.intro .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,20,38,.15) 0%,rgba(11,20,38,.45) 45%,rgba(11,20,38,.88) 100%)}
.intro .ib{position:relative;z-index:1;width:100%;max-width:980px;padding-block:48px;padding-left:max(24px,6vw);padding-right:max(24px,6vw);opacity:0;transform:translateY(14px);transition:opacity .8s ease .2s,transform .8s ease .2s}
.intro.go .ib{opacity:1;transform:none}
.intro .eb{font-size:12px;font-weight:800;letter-spacing:3px;color:#8fb0f5}
.intro h1{font-size:clamp(30px,4.6vw,54px);line-height:1.18;letter-spacing:-1px;margin:12px 0 14px;text-wrap:balance}
.intro p{font-size:16px;color:#e8e2da;margin:0 0 22px;max-width:640px}
.intro .flow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.intro .flow span{border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 12px;font-size:13px;background:rgba(255,255,255,.08)}
.intro .flow b{color:#8fb0f5;font-weight:700;margin:0 2px}
.intro .row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.intro .stat b{display:block;font-size:30px;font-weight:800}
.intro .stat span{font-size:12px;color:#d9d2c9}
.intro .go-btn{background:#fff;color:#ffffff;border:0;border-radius:12px;padding:14px 26px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .15s}
.intro .go-btn:hover{transform:translateY(-2px)}
.intro .go-btn:focus-visible{outline:3px solid #8fb0f5;outline-offset:3px}
.intro .timer{position:absolute;left:0;bottom:0;height:3px;background:#0d9488;width:0;z-index:2}
.intro.go .timer{width:100%;transition:width 4.2s linear}
.intro .aitag{right:16px;bottom:14px}
.logo{cursor:pointer}

  </div>
  <div class="grid row2">
    <div class="card"><h3>불러온 정보 <small>틀린 칸만 고치고 '맞음'을 눌러 주세요</small></h3>
      ${sec('expo', '전시 정보', `${esc(E.name)} 참가사 목록 기준`)}
      ${sec('web', '회사·제품 정보', R.loaded ? `${esc(R.url)}${I.files ? ' · 첨부 자료' : ''}에서 AI가 정리` : '아직 불러오지 않았습니다')}
      ${sec('self', '직접 정해 주세요', '불러올 수 없는 정보만 남겼습니다')}

    <div class="card"><h3>AI가 정리한 고객 타깃</h3>${targetBox()}</div>
  </div>`;
}
/* 1단계: 전시·부스를 고르면 참가사 목록 값으로 채운다. 회사가 바뀌면 2단계를 다시 하게 한다 */
function applyExpo() {
  const R = srcState(), E = curExpo(), B = E.booths[R.booth] || E.booths[0];
  Object.assign(S.info, { popup: `${E.name.replace(' (가상)', '')} ${B.brand.replace(' (가상)', '')} 부스`, period: E.period, hours: E.hours, place: `${E.hall} ${B.booth} (가상)` });
  ['popup', 'period', 'hours', 'place'].forEach(k => R.ok[k] = false);
  if (R.url !== B.url) { R.url = B.url; R.loaded = false; ['brand', 'product', 'features', 'target', 'keywords'].forEach(k => R.ok[k] = false); }
}
/* 2단계: 웹사이트·소개서에서 불러온 것처럼 채운다 (데모: 부스별로 미리 만든 값) */
function applyWeb() {
  const R = srcState(), B = curExpo().booths[R.booth] || curExpo().booths[0], D = B.product ? B : DEFAULT_INFO;
  Object.assign(S.info, { brand: B.brand.replace(' (가상)', ''), product: D.product, features: D.features, target: D.target, keywords: D.keywords });
  R.loaded = true;
  ['brand', 'product', 'features', 'target', 'keywords'].forEach(k => R.ok[k] = false);
}
// 입력 중인 값이 다시 그릴 때 사라지지 않게 화면 값을 먼저 담아 둔다
function keepInfoInputs() { document.querySelectorAll('[data-info]').forEach(el => { if (!el.disabled) S.info[el.dataset.info] = el.value.trim(); }); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-acc]'); if (!b) return;
  const g = b.dataset.acc, here = !!b.closest('.here'), unf = b.getAttribute('aria-expanded') === 'true';
  // 누를 때마다 펼침·접힘이 바뀐다. 다른 단계는 하나만 펼치고, 지금 보는 단계는 직접 접기 전까지 펼쳐 둔다
  if (unf) set(here ? { navShut: g, navOpen: S.navOpen === g ? null : S.navOpen } : { navOpen: null });
  else set(here ? { navShut: null } : { navOpen: g });
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-src]'); if (!el) return;
  keepInfoInputs();
  const R = srcState();
  if (el.dataset.src === 'expo') { R.expo = el.value; R.booth = 0; } else R.booth = +el.value;
  applyExpo(); save(); render(); toast('참가사 목록에서 전시 정보를 채웠습니다. 확인 후 \'맞음\'을 눌러 주세요');
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-ok],[data-tone]'); if (!t) return;
  keepInfoInputs();
  if (t.dataset.tone) S.info.tone = t.dataset.tone;
  else { const R = srcState(); R.ok[t.dataset.ok] = !R.ok[t.dataset.ok]; }
  save(); render();
});
function targetBox() {
  const I = S.info, t = I.target.split(',');
  return `<table><tr><td style="width:84px;color:var(--sub)">주 타깃</td><td>${esc(t[0])}</td></tr>
    <tr><td style="color:var(--sub)">고민</td><td>${esc((t[1] || '').trim() || '-')}</td></tr>
    <tr><td style="color:var(--sub)">찾는 경로</td><td>인스타그램 저장 게시물, 링크드인, 네이버 '${esc(lines(I.keywords)[0] || '')}' 검색, 전시회 참가사 목록</td></tr>
    <tr><td style="color:var(--sub)">방문 시간</td><td>해외 바이어는 개막 첫 이틀 오전 · 국내 실무자는 평일 오후</td></tr></table>`;
}

/* ===================== 홍보 컨셉 ===================== */

  const label = { approved: ['승인 완료', 'ok'], proposed: ['고객사 선택 대기', 'wait'], revise: ['수정 요청됨', 'warn'] }[st];
  return header('홍보 컨셉 · 제안 확인', false) + `

    <div class="card"><h3>컨셉 후보 3안 <small>AI 제안 → 기업이 선택 · 제안 v${S.concept.set + 1}</small> <span class="st ${label[1]}">${label[0]}</span></h3>
      <div class="opt">${opts.map((o, i) => `<button class="o ${i === S.concept.chosen ? 'on' : ''}" data-pick="${i}"><div class="oa">${scene(CONCEPT_IMGS[S.concept.set][i])}</div><div class="ob"><div class="k"><span>${o.k}안</span>${i === 0 ? '<span class="tag ai">AI 추천</span>' : ''}</div><div class="h">${esc(o.head)}</div><div class="d">${esc(o.d)}</div><div class="w">추천 이유: ${esc(o.why)}</div></div></button>`).join('')}</div></div>
  </div>

    <div class="card"><h3>채널·톤 제안</h3>
      <div class="mix">${[['인스타그램', C.mix[0], 'var(--c1)'], ['숏폼', C.mix[1], 'var(--c2)'], ['블로그', C.mix[2], 'var(--c3)']].map(([n, v, c]) => `<div style="width:${v}%;background:${c}">${n} ${v}%</div>`).join('')}</div>
      <div class="chips" style="margin-top:8px">${C.tone.map(t => `<span class="chip on">${esc(t)}</span>`).join('')}</div>

  <div class="card" style="margin-top:14px"><h3>결정</h3>

      <span class="note" style="margin:0">승인하면 이 컨셉으로 인스타그램·블로그·숏폼 제작이 시작됩니다.</span></div>
    <div class="hist" style="margin-top:12px">${S.concept.hist.map(h => `<div>${h[0]} · <b>${h[1]}</b> ${esc(h[2])}</div>`).join('')}</div></div>`;
}

/* ===================== 콘텐츠 제작 ===================== */
/* ===================== 콘텐츠 종류별 화면 (블로그 / 카드뉴스 / 영상) ===================== */
function ctHead(kind) {
  const tab = S.ctab || 'approve', n = kindPending(kind);
  return header(CT[kind][1], false) + `<div class="bigtabs">${CT_TABS.map(([k, l]) => `<button data-ctab="${k}" class="${tab === k ? 'on' : ''}">${l}${k === 'approve' && n ? ` <span class="cnt">${n}</span>` : ''}</button>`).join('')}</div>`;
}
function ctypeView(kind) {
  const tab = S.ctab || 'approve';
  return tab === 'make' ? makeView(kind) : contentView(kind);
}
function makeView(kind) {
  const M = S.make, C = curConcept();
  if (kind) M.tab = kind;
  const tabs = [['feed', '인스타그램 피드·카드뉴스'], ['reel', '숏폼 릴스'], ['blog', '블로그 원고']];

      <label>목표 글자 수</label><div class="chips">${[600, 800, 1000].map(x => `<button class="chip ${+M.blogLen === x ? 'on' : ''}" data-mk="blogLen" data-v="${x}">${fmt(x)}자 내외</button>`).join('')}</div>`;
  } else {
    form = `<div class="form"><label>목적</label><div class="chips">${['티저', '참가 안내', '현장 스케치', '이벤트'].map(x => `<button class="chip ${M.purpose === x ? 'on' : ''}" data-mk="purpose" data-v="${x}">${x}</button>`).join('')}</div>
      ${M.tab === 'reel' ? `<label>제작 방식</label><div>${vmodeCards(M.videoMode || 'shot')}</div>` : ''}
      ${M.tab === 'feed' ? `<label>형식</label><div class="chips">${['카드뉴스', '단일 이미지'].map(x => `<button class="chip ${M.format === x ? 'on' : ''}" data-mk="format" data-v="${x}">${x}</button>`).join('')}</div>` : ''}`;
  }
  const K = M.tab, ph = mkFiles(K).filter(f => f.role === 'photo'), rf = mkFiles(K).filter(f => f.role === 'ref'), vm = K === 'reel' ? M.videoMode || 'shot' : '';
  const phName = vm === 'shot' ? '촬영본·사진' : vm === 'ai' ? '참고 이미지' : '사진 자료';
  form += `<label>지시 사항</label><div><textarea class="inp" data-brief="${K}" rows="4" placeholder="${K === 'blog' ? '예: 업계 엔지니어 대상, 검사 속도 비교를 중심으로, 마지막 문단에 상담 예약 안내' : K === 'reel' ? '예: 15초 세로 영상, 첫 2초에 장비 클로즈업, 자막은 짧게, 마지막 컷에 부스 번호' : '예: 바이어 대상 5장, 2장에 검사 속도 비교, 마지막 장에 상담 예약 안내'}">${esc(mkBrief(K))}</textarea>
      <div class="h">어떤 콘텐츠를 만들지 적어 주세요. 초안과 함께 저장되고 승인 화면에도 보입니다.</div></div>
    <label>${phName}</label><div><div class="upl">${ph.map(f => `<div class="ph">${fileArt(f.id).replace('class="art"', '')}<button class="x" data-rmfile="${f.id}" aria-label="${esc(f.name)} 빼기">✕</button></div>`).join('')}<button class="btn sm" data-upbtn="photo">+ ${vm === 'shot' ? '촬영본' : vm === 'ai' ? '참고 이미지' : '사진'} 추가</button></div>
      <input type="file" id="up_photo" data-up="photo" accept="${vm === 'shot' ? 'image/*,video/*' : 'image/*'}" multiple hidden>
      <div class="h">${K === 'feed' ? '올린 순서대로 카드뉴스 장마다 쓰입니다. 사진이 모자라면 기본 사진으로 채웁니다.' : vm === 'shot' ? '찍어 둔 영상·사진을 올리면 순서대로 컷에 배치합니다. 모자란 컷은 \'촬영 필요\'로 표시해 촬영 목록을 만듭니다. 영상은 300MB까지.' : vm === 'ai' ? '제품·부스 사진을 올리면 AI가 실제 외형을 참고해 컷을 만듭니다. 올린 순서대로 컷마다 참고합니다.' : '첫 사진이 대표 이미지가 됩니다. 사진이 모자라면 기본 사진으로 채웁니다.'}</div></div>
    <label>근거 자료</label><div><div class="upl">${rf.map(f => refChip(f, true)).join('')}<button class="btn sm" data-upbtn="ref">+ 자료 추가</button></div>

  form += `<label>게시 희망일</label><div><input type="date" class="inp" style="max-width:200px" data-mkdate value="${M.date}" min="${CAMPAIGN.asOf}" max="${CAMPAIGN.end}"></div>
    <label>반영되는 정보</label><div style="font-size:13px;color:var(--sub);padding-top:8px">컨셉 <b>${C.k}안 · ${esc(C.head)}</b> · 키워드 ${esc(S.info.keywords)} · 톤 ${esc(S.info.tone)} ${execOnly() ? '' : '<a href="#" data-nav="info">정보 수정</a>'}</div></div>
    <div class="acts"><button class="btn pri" data-act="gen">AI 초안 만들기</button>${S.draft ? '<button class="btn" data-act="gen">다시 만들기</button>' : ''}</div>`;
  return (kind ? ctHead(kind) : header('콘텐츠 제작', false) + `

  <div class="note">데모에서는 입력 정보로 템플릿 초안을 만듭니다. 실제 서비스에서는 AI가 생성하고 담당자가 검수합니다.</div>`;
}
function draftView(d) {

    right = `<b>AI 자동 점검</b><div id="blogchk">${checkList(blogChecks(d, d.body))}</div>

function cperfView(kind) {
  const mine = c => !kind || c.kind === kind;
  const posted = allContents().filter(c => mine(c) && CONTENT_PERF[c.id]).map(c => Object.assign({ c }, CONTENT_PERF[c.id]));
  const T = posted.reduce((a, p) => { ['reach', 'views', 'saves', 'shares', 'clicks'].forEach(k => a[k] += p[k]); return a; }, { reach: 0, views: 0, saves: 0, shares: 0, clicks: 0 });
  const sr = p => pct(p.saves + p.shares, p.reach);
  const best = posted.slice().sort((a, b) => sr(b) - sr(a))[0], top = posted.slice().sort((a, b) => b.reach - a.reach)[0];
  if (!posted.length) return (kind ? ctHead(kind) : header('콘텐츠 성과', false)) + `<div class="card"><div class="empty">아직 게시된 ${kind ? CT[kind][1] : '콘텐츠'}가 없습니다. 게시가 시작되면 성과가 쌓입니다.</div></div>`;
  const isReel = p => p.c.kind === 'reel';
  const grp = f => { const g = posted.filter(f); return g.length ? { n: g.length, reach: g.reduce((a, p) => a + p.reach, 0) / g.length, sr: g.reduce((a, p) => a + sr(p), 0) / g.length } : null; };
  const reel = grp(isReel), feed = grp(p => !isReel(p));
  const waiting = allContents().filter(c => mine(c) && !CONTENT_PERF[c.id]);
  return (kind ? ctHead(kind) : header('콘텐츠 성과', false, `브랜드 계정에 게시한 콘텐츠 기준 · 인플루언서 게시물은 인플루언서·체험단 성과에서 · 기준일 ${md(CAMPAIGN.asOf)} · 가상 데이터`)) + `

    <div class="card kpi"><div class="l">${ico('eye')}콘텐츠 도달</div><div class="v">${fmt(T.reach)}</div><div class="d">조회 ${fmt(T.views)}</div></div>
    <div class="card kpi"><div class="l">${ico('bookmark')}저장·공유</div><div class="v">${fmt(T.saves + T.shares)}</div><div class="d">반응률 ${pct(T.saves + T.shares, T.reach).toFixed(1)}%</div></div>
    <div class="card kpi core"><div class="l">${ico('pin')}상담 예약·문의 클릭</div><div class="v">${fmt(T.clicks)}</div><div class="d">콘텐츠에서 바로 이어진 클릭</div></div>
  </div>
  ${kind ? '' : brandFeed()}
  <div class="grid row2">
    <div class="card"><h3>콘텐츠별 성과</h3>
      <table><tr><th>콘텐츠</th><th class="n">도달</th><th class="n">조회</th><th class="n">저장</th><th class="n">공유</th><th class="n">상담 예약·문의</th><th class="n">반응률</th></tr>
      ${posted.map(p => `<tr><td><div style="display:flex;gap:10px;align-items:center"><div class="thumb" style="width:44px;height:44px">${contentScene(p.c)}</div><div><b>${esc(p.c.type)}</b><div class="why">${p.c.ch} · ${md(p.c.date)} 게시</div></div></div></td><td class="n">${fmt(p.reach)}</td><td class="n">${fmt(p.views)}</td><td class="n">${fmt(p.saves)}</td><td class="n">${fmt(p.shares)}</td><td class="n">${fmt(p.clicks)}</td><td class="n"><b>${sr(p).toFixed(1)}%</b></td></tr>`).join('')}</table>

    <div class="card"><h3>콘텐츠별 도달</h3>${barChart(posted.map(p => [p.c.type.replace(/\s*#\d/, m => m.trim()), p.reach]), posted.map(() => 'var(--brand)'))}

  </div>

    <div class="card"><h3>이번 기간에 알게 된 점</h3><ul style="margin:0;padding-left:20px">
      <li>도달이 가장 큰 콘텐츠는 <b>${esc(top.c.type)}</b>(${fmt(top.reach)})입니다.</li>

    <div class="card"><h3>성과 집계 전 콘텐츠 <small>${waiting.length}건</small></h3>
      <table>${waiting.map(c => { const s2 = STATUS[contentState(c).status]; return `<tr><td>${esc(c.type)}</td><td>${md(c.date)}</td><td><span class="st ${s2[1]}">${s2[0]}</span></td></tr>`; }).join('')}</table>

        <div class="ign"><div><b>${fmt(posts)}</b>게시물</div><div><b>${a.fol >= 10000 ? (a.fol / 10000).toFixed(1) + '만' : fmt(a.fol)}</b>팔로워</div><div><b>${fmt(following)}</b>팔로잉</div></div></div>
      <div class="igbio"><b>${esc(a.name.replace('@demo_', '').replace(/_/g, ' '))}</b> · ${a.tier}<br>${esc(IG_BIO[a.cat] || a.cat)}${cand ? `<div class="why" style="margin-top:4px">추천 이유: ${esc(cand.why)}</div>` : ''}</div>
      <div class="igcamp"><div class="igct">이번 캠페인 ${status}</div><div class="igst">${stats.map(([l, v]) => `<div><span>${l}</span><b>${esc(v)}</b></div>`).join('')}</div></div>
      <div class="iggrid">${tiles.join('')}</div>
      <div class="note" style="padding:0 14px 14px">가상 계정 · 사진은 AI 생성 예시입니다. 실서비스에서는 실제 인스타그램 계정과 게시물이 연결되고 '인스타그램에서 열기'로 이동합니다.</div>
    </div></div>`;
  document.body.appendChild(el);
  const close = () => { el.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if (e.key === 'Escape') close(); };
  el.addEventListener('click', e => { if (e.target === el || e.target.closest('.igx')) close(); });
  document.addEventListener('keydown', key);
  el.querySelector('.igx').focus();
}

  const sumk = (a, k) => a.reduce((x, i) => x + i[k], 0);

      ${rank.map(i => `<tr><td>${avatar(i.name)}${i.name}</td><td>${i.tier}</td><td class="n">${i.posts}</td><td class="n">${fmt(i.reach)}</td><td class="n">${fmt(i.saves)}</td><td class="n"><b>${fmt(i.visits)}</b></td><td class="n">${(i.visits / i.reach * 1000).toFixed(1)}</td><td class="n">${fmt(i.fee * 10000 / i.visits)}원</td></tr>`).join('')}</table></div>

const toISO = t => { const m = String(t).match(/(\d{1,2})\.(\d{1,2})/); return m ? `${+m[1] >= 9 ? 2026 : 2027}-${String(m[1]).padStart(2, '0')}-${String(m[2]).padStart(2, '0')}` : null; };
function allEvents() {

  const past = d => d < CAMPAIGN.asOf;

  });

    if (r.id === 'a1') push('2026-11-30', 'ad', '메타 광고 집행 시작', L, { nav: 'ads' });
    else { push(toISO(r.date), 'ad', '광고 증액 요청', L, { nav: 'ads', note: r.title });
      if (st === 'approved') { push('2026-12-12', 'ad', '주말 증액 집행 시작', ['예정', 'mute'], { nav: 'ads' }); push('2026-12-13', 'ad', '주말 증액 집행 종료', ['예정', 'mute'], { nav: 'ads' }); } } });
  PR.releases.forEach(r => push(toISO(r.date), 'ad', '보도자료: ' + r.title, r.status === '배포 완료' ? [`배포 완료 · 게재 ${r.articles}건`, 'ok'] : [STATUS[contentState(BASE_CONTENTS.find(c => c.id === 'k8')).status][0], 'mute'], r.status === '배포 완료' ? { nav: 'pr' } : { nav: 'content', cur: 'k8' }));

function cardTables() {
  document.querySelectorAll('.main table').forEach(t => {

  /* ---------- 플랜 (규칙 기반 가안) ---------- */
  function fixSum(rows) {

    if (tot <= 0) on.forEach(r => r.pct = Math.floor(100 / on.length));
    else on.forEach(r => r.pct = Math.round((+r.pct || 0) / tot * 100));
    const diff = 100 - on.reduce((s, r) => s + r.pct, 0);
    on.slice().sort((x, y) => y.pct - x.pct)[0].pct += diff;
  }

    const rows = Object.keys(CH).filter(id => w[id] != null).map(id => ({ id, on: true, pct: Math.round(w[id] / sum * 100) }));
    fixSum(rows);
    return { budget: BUDGET_MID[a.promo.budget], start: iso(addD(open, -28)), rows, memo: '', target: {}, made: a.history ? a.at.split(' ')[0] : md2(TODAY) };

      visit: Math.round((80 + p.budget * 0.12 + (has('inf') ? 60 : 0) + ads.reduce((s, x) => s + x.clk, 0) * 0.04) / 10) * 10,
      leads: has('leads') ? Math.round((15 + p.budget / 60) / 5) * 5 : Math.round((5 + p.budget / 150) / 5) * 5,

        <button type="button" class="btn pri" data-ik="act:gen">${ICN.spark} AI 기본안 만들기</button></div>`;
    }
    const c = planCalc(a, p), e = expoOf(a), ph = phases(a, p), on = p.rows.filter(r => r.on);
    const reasons = [];
    a.promo.goals.forEach(g => { const top = Object.keys(GOAL_BOOST[g] || {}).filter(id => p.rows.some(r => r.id === id)).map(id => CH[id].t); if (top.length) reasons.push(`'${g}' 목표라 ${top.join('·')} 비중을 높였습니다`); });
    if (a.promo.budget === '아직 모르겠어요') reasons.push('예산이 미정이라 500만 원 기준으로 잡았습니다. 상담 때 다시 맞춰야 합니다');
    if (a.promo.scope === 'run') reasons.push('실행만 맡겨서 프레스룸 구축은 뺐습니다');
    if (a.expo.type.includes('일부')) reasons.push('공동관 부스라 현장 촬영 비중은 낮게 두는 게 좋습니다');
    const maxPct = Math.max(...on.map(r => +r.pct || 0), 1);
    return `<h2>광고 플래닝</h2><p class="lead">AI가 만든 기본안입니다(${p.made} 생성). 비중·채널·일정을 고치면 금액과 목표가 바로 다시 계산됩니다.</p>
      <div class="basis">
        <div class="fld"><label for="p_budget">총예산 (만 원)</label><input id="p_budget" type="number" min="0" step="50" value="${p.budget}" data-ikf="budget"><span class="help">신청: ${esc(a.promo.budget)}</span></div>
        <div class="fld"><label for="p_start">홍보 시작일</label><input id="p_start" type="date" value="${p.start}" max="${e.open}" data-ikf="start"><span class="help">개막 ${md2(D(e.open))} · 기본 4주 전</span></div>
        <div class="fld"><label>매체비 (광고 집행)</label><b class="bn">${won(c.media)}</b><span class="help">나머지 ${won(p.budget - c.media)}는 제작·운영</span></div>
        <div class="fld"><label>쓰는 채널</label><b class="bn">${on.length}개</b><span class="help">빼려면 표에서 체크 해제</span></div>
      </div>
      ${reasons.length ? `<div class="aibox"><span class="ic">${ICN.spark}</span><div><b>AI가 이렇게 짠 이유</b><ul>${reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div></div>` : ''}
      <div class="sub2">채널 구성과 예산 배분 <button type="button" class="btn sm ghost" data-ik="act:regen">${ICN.spark} 기본안 다시 만들기</button></div>
      <div class="scroll"><table class="tbl"><thead><tr><th scope="col"><span class="sr">사용</span></th><th scope="col">채널</th><th scope="col" class="r">비중(%)</th><th scope="col" style="min-width:110px">비중</th><th scope="col" class="r">금액</th></tr></thead>
        <tbody>${p.rows.map((r, i) => { const ch = CH[r.id]; return `<tr class="${r.on ? '' : 'off'}">
          <td><input type="checkbox" data-ikf="on:${i}" ${r.on ? 'checked' : ''} aria-label="${ch.t} 사용"></td>
          <td class="chn"><b>${ch.t}<span class="kindtag ${ch.kind === 'm' ? 'm' : ''}">${ch.kind === 'm' ? '매체비' : '제작·운영'}</span></b><small>${ch.role}</small></td>
          <td class="r"><input type="number" min="0" max="100" value="${r.pct}" data-ikf="pct:${i}" aria-label="${ch.t} 비중" ${r.on ? '' : 'disabled'}></td>
          <td><div class="share" tabindex="0" data-tip="${ch.t} ${r.on ? r.pct : 0}% · ${won(c.amt(r))}"><i style="width:${r.on ? (+r.pct || 0) / maxPct * 100 : 0}%"></i></div></td>
          <td class="r">${won(c.amt(r))}</td></tr>`; }).join('')}</tbody>
        <tfoot><tr><td></td><td>합계</td><td class="r">${c.tot}%</td><td></td><td class="r">${won(on.reduce((s, r) => s + c.amt(r), 0))}</td></tr></tfoot></table></div>
      ${c.tot !== 100 ? `<div class="warnrow bad"><span>${ICN.alert} 비중 합계가 ${c.tot}%입니다. 100%가 되어야 합니다.</span><button type="button" class="btn sm" data-ik="act:fix">비율대로 100% 맞추기</button></div>` : `<div class="warnrow good"><span>${ICN.check} 비중 합계 100%</span></div>`}
      ${c.ads.length ? `<div class="sub2">광고 세부 <span class="subnote">집행 ${md2(addD(D(e.open), -14))}~${md2(addD(D(e.close), 2))} · ${c.adDays}일 · 단가는 실측 전 가안</span></div>
      <div class="ads">${c.ads.map(x => { const R = AD_RATE[x.r.id]; return `<div class="adc"><h3>${CH[x.r.id].t}<span>${won(x.m / 10000)}</span></h3>
        <dl class="dl"><dt>하루 예산</dt><dd>${Math.round(x.daily).toLocaleString('ko-KR')}원</dd><dt>단가 가안</dt><dd>${R.cpm ? `CPM ${R.cpm.toLocaleString('ko-KR')}원` : `CPC ${R.cpc.toLocaleString('ko-KR')}원`}</dd><dt>타깃</dt><dd><textarea data-ikf="target:${x.r.id}" aria-label="${CH[x.r.id].t} 타깃">${esc(p.target[x.r.id] != null ? p.target[x.r.id] : R.target)}</textarea></dd></dl>
        <div class="est"><div><small>예상 노출</small><b>${big(x.imp)}</b></div><div><small>예상 클릭</small><b>${big(x.clk)}</b></div></div></div>`; }).join('')}</div>` : '<p class="note">광고 운영을 신청하지 않아 매체비 없이 짰습니다. 필요하면 상담 때 제안하세요.</p>'}
      <div class="sub2">단계별 일정</div>
      ${tlHtml(a, p)}
      <div class="sub2">목표 지표 <span class="subnote">예산·채널로 계산한 가안</span></div>
      ${kpiHtml(c, true)}
      <div class="sub2">PM 메모</div>
      <textarea class="pmmemo" data-ikf="memo" placeholder="상담 때 확인할 것, 견적 조정 메모 등">${esc(p.memo)}</textarea>
      <div class="nextbar"><button type="button" class="btn" data-ik="view:2">← 정보 확인</button><button type="button" class="btn pri" data-ik="act:toSummary" ${c.tot !== 100 ? 'disabled title="비중 합계를 100%로 맞춰 주세요"' : ''}>플랜 확정, 요약 만들기 →</button></div>`;
  }
  function tlHtml(a, p) {
    const ph = phases(a, p), on = p.rows.filter(r => r.on);
    return `<div class="scroll"><table class="tbl tl"><thead><tr><th scope="col" style="text-align:left">채널</th>${PH.map((t, i) => `<th scope="col">${t}<small>${md2(ph[i][0])}~${md2(ph[i][1])}</small></th>`).join('')}</tr></thead>
      <tbody>${on.map(r => `<tr><th scope="row">${CH[r.id].t}</th>${TASKS[r.id].map((t, i) => `<td class="${t ? 'on' + (i === 2 ? ' ev' : '') : ''}">${esc(t)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  function kpiHtml(c, notes) {
    return `<div class="kpis">
      <div class="kpi"><small>기사 게재</small><b>${c.kpi.news}<em>건</em></b>${notes ? '<span>보도자료 3회 기준</span>' : ''}</div>
      <div class="kpi"><small>부스 방문 인증</small><b>${c.kpi.visit.toLocaleString('ko-KR')}<em>명</em></b>${notes ? '<span>QR 인증 기준</span>' : ''}</div>
      <div class="kpi"><small>상담 리드</small><b>${c.kpi.leads}<em>건</em></b>${notes ? '<span>명함·예약 합계</span>' : ''}</div>
      <div class="kpi"><small>온라인 노출</small><b>${big(c.kpi.reach)}<em>회</em></b>${notes ? '<span>광고·SNS 합계</span>' : ''}</div></div>`;
  }
  function paperHtml(a) {
    const p = IS.plan[a.id], c = planCalc(a, p), e = expoOf(a), ph = phases(a, p), on = p.rows.filter(r => r.on), asks = prog(a).ask;
    return `<div class="paper">
      <div class="ph"><small>홍보 계획 ${IS.status[a.id] === 'done' ? '(확정)' : '제안 (가안)'}</small><h3>${esc(a.company.name)} · ${esc(e.name)}</h3><p>${esc(e.period)} · ${esc(e.hall)} ${esc(a.expo.booth)}</p></div>
      <div class="pb">
        <div><h4>이번 홍보의 목표</h4><div class="chips">${a.promo.goals.map(g => `<span class="chip">${esc(g)}</span>`).join('')}</div></div>
        <div><h4>채널과 예산 (총 ${won(p.budget)})</h4><div class="scroll"><table class="tbl"><thead><tr><th scope="col">채널</th><th scope="col">하는 일</th><th scope="col" class="r">비중</th><th scope="col" class="r">금액</th></tr></thead><tbody>${on.map(r => `<tr><td><b>${CH[r.id].t}</b></td><td class="role">${CH[r.id].role}</td><td class="r">${r.pct}%</td><td class="r">${won(c.amt(r))}</td></tr>`).join('')}</tbody></table></div></div>
        <div><h4>일정</h4><ol>${PH.map((t, i) => `<li><b>${t}</b> ${md2(ph[i][0])}~${md2(ph[i][1])} — ${esc(on.map(r => TASKS[r.id][i]).filter(Boolean).slice(0, 3).join(', ') || '-')}</li>`).join('')}</ol></div>
        <div><h4>목표 (가안)</h4>${kpiHtml(c, false)}</div>
        ${asks.length && IS.status[a.id] !== 'done' ? `<div><h4>함께 확인 부탁드릴 것</h4><ol>${asks.map(r => `<li>${esc(r.q)}</li>`).join('')}</ol></div>` : ''}
        ${IS.status[a.id] === 'done' ? '' : '<div><h4>다음 단계</h4><ol><li>이 계획을 보시고 고칠 부분을 알려 주세요.</li><li>확정하시면 견적서를 보내 드리고, 고객사 대시보드를 열어 드립니다.</li><li>대시보드에서 콘텐츠·보도자료를 확인하고 승인하시면 됩니다.</li></ol></div>'}
      </div></div>`;
  }
  function vSummary(a) {
    if (!IS.plan[a.id]) return `<div class="gen"><h2>고객 확인용 요약</h2><p>광고 플래닝을 먼저 만들어 주세요.</p><button type="button" class="btn pri" data-ik="view:3">광고 플래닝으로</button></div>`;
    const st = IS.status[a.id], reg = IS.reg[a.id];
    return `<div class="status-line">${st === 'sent' ? `<span class="pill s-sent">고객 확인 중</span> ${IS.sentAt[a.id] || ''}에 보냈습니다. 회신을 기다리는 중입니다.`
        : st === 'done' ? `<span class="pill s-done">확정</span> ${reg ? '고객사로 등록했습니다. 왼쪽 고객사 목록에서 운영을 이어 갑니다.' : '고객이 확정했습니다.'}`
        : '<span class="pill s-plan">작성 완료</span> 내용을 보고 고객에게 보내세요.'}</div>
      ${paperHtml(a)}
      <p class="note">금액·목표는 가안입니다. 광고 단가는 실측 전이고, 견적서에서 확정합니다.</p>
      <div class="nextbar"><button type="button" class="btn" data-ik="view:3">← 플래닝 고치기</button><button type="button" class="btn" data-ik="act:sumcopy">글로 복사</button>
        ${st === 'done' ? (reg ? `<button type="button" class="btn pri" data-ik="client:${esc(a.company.name)}">${esc(a.company.name)} 운영 화면 열기 →</button>` : '<button type="button" class="btn teal" data-ik="act:register">고객사로 등록</button>')
          : st === 'sent' ? '<button type="button" class="btn teal" data-ik="act:confirm">고객 확정 · 고객사로 등록</button>' : '<button type="button" class="btn pri" data-ik="act:send">고객에게 보냄으로 표시</button>'}</div>`;
  }
  function summaryText(a) {
    const p = IS.plan[a.id], c = planCalc(a, p), e = expoOf(a), ph = phases(a, p), on = p.rows.filter(r => r.on);
    return `[홍보 계획 제안 (가안)] ${a.company.name} · ${e.name} ${a.expo.booth}\n\n목표: ${a.promo.goals.join(', ')}\n총예산: ${won(p.budget)}\n\n채널과 예산\n${on.map(r => `- ${CH[r.id].t}: ${r.pct}% (${won(c.amt(r))})`).join('\n')}\n\n일정\n${PH.map((t, i) => `- ${t} ${md2(ph[i][0])}~${md2(ph[i][1])}`).join('\n')}\n\n목표(가안): 기사 ${c.kpi.news}건 · 방문 인증 ${c.kpi.visit}명 · 상담 리드 ${c.kpi.leads}건 · 온라인 노출 ${big(c.kpi.reach)}회`;
  }

  /* 고객사 '홍보 계획' 화면: 확정 플랜을 읽기 전용으로 */
  function planPage(brand) {
    const a = appFor(brand);
    if (!a || !IS.plan[a.id]) return '<div class="panel empty">이 고객사의 신청 기록이 없습니다</div>';
    const p = IS.plan[a.id];
    return `<div class="panel"><div class="status-line"><span class="pill s-done">${IS.status[a.id] === 'done' ? '확정' : '진행 중'}</span> 신청 ${a.rcpt} (${a.at})에서 만든 플랜입니다. 바꾸려면 '플래닝 고치기'를 누르세요.</div>
      ${paperHtml(a)}
      <div class="sub2">채널별 단계 일정</div>${tlHtml(a, p)}
      ${p.memo ? `<div class="memo"><b>PM 메모</b> — ${esc(p.memo)}</div>` : ''}
      <div class="nextbar"><button type="button" class="btn" data-ik="act:sumcopy:${a.id}">글로 복사</button><button type="button" class="btn pri" data-ik="edit:${a.id}">플래닝 고치기</button></div></div>`;
  }

  /* ---------- 스타일 (Shadow DOM 안에서만 쓰인다) ---------- */
  const CSS = `
.ikroot{--bg:#f3f6fb;--card:#fff;--soft:#eaf0fc;--line:#dbe2ee;--ink:#152033;--sub:#5b6880;--pri:#1f4fd1;--pri-ink:#fff;--navy:#0b1f4d;--teal:#0d9488;--warn:#b45309;--err:#c2410c;
  container-type:inline-size;color:var(--ink);font-size:15px;line-height:1.6;font-family:inherit}
*{box-sizing:border-box}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px;border-radius:6px}
.sr{position:absolute;left:-9999px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.btn select{border:0;background:transparent;font-weight:700}
.lay{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.inbox{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:sticky;top:16px}
.inbox header{padding:14px 16px 8px}
.inbox header h2{font-size:16px;font-weight:800}
.inbox header p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.tabs{display:flex;gap:4px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--sub)}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs button i{font-style:normal;margin-left:4px;opacity:.75}

.list li button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px}

.list .nm{font-weight:800;display:flex;align-items:center;gap:6px}
.list .nm .new{width:7px;height:7px;border-radius:50%;background:var(--err)}
.list .at{font-size:12px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.list .ex{grid-column:1/-1;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .row3{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.list .empty{padding:30px 16px;text-align:center;color:var(--sub)}
.pill{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--pri);white-space:nowrap}
.pill.s-new{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.pill.s-check{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.s-sent{background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal)}
.pill.s-done{background:var(--ink);color:#fff}
.pill.g{background:transparent;border:1px solid var(--line);color:var(--sub)}
.reset{padding:10px 16px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;align-items:center;gap:8px}
.reset button{background:none;border:0;color:var(--pri);font-weight:700;cursor:pointer;font-size:12px;padding:4px}
.detail{min-width:0}
.dhead{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.dhead .t1{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.dhead h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dhead .meta{margin:6px 0 0;color:var(--sub);font-size:14px}
.back{display:none;background:none;border:0;color:var(--pri);font-weight:700;padding:0 0 10px;cursor:pointer}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
